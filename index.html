<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Tarot - ร่ายเวทมนตร์กับคุณหมี</title>
  
  <!-- ฟอนต์ภาษาไทยมินิมอล Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- MediaPipe / Camera Utilities สำหรับตรวจจับท่าทางมือ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color-1: #0a0612;
      --bg-color-2: #190c2e;
      --bg-color-3: #2d124d;
      --accent-gold: #e2c974;
      --accent-glow: rgba(226, 201, 116, 0.4);
      --font-main: 'Noto Sans Thai', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-main);
      background: radial-gradient(ellipse at bottom, var(--bg-color-3) 0%, var(--bg-color-2) 50%, var(--bg-color-1) 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 300;
    }

    /* Canvas พื้นหลังดวงดาว 3D */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Container หลัก */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* สไตล์ตัวหนังสือมินิมอล */
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--accent-gold);
      margin-bottom: 24px;
      text-shadow: 0 0 12px var(--accent-glow);
      line-height: 1.6;
    }

    /* ปุ่มกดสไตล์ Glassmorphism มินิมอล */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 280px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(226, 201, 116, 0.25);
      color: #f0e6ff;
      padding: 14px 24px;
      border-radius: 30px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .btn:hover, .btn:active {
      background: rgba(226, 201, 116, 0.15);
      border-color: var(--accent-gold);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: rgba(226, 201, 116, 0.12);
      border-color: var(--accent-gold);
    }

    /* ==========================================
       SVG น้องหมีน่ารัก & แอนิเมชันร่ายเวท
       ========================================== */
    .bear-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 12px;
      display: none;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.8s ease;
    }

    .bear-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(226, 201, 116, 0.3));
    }

    /* แอนิเมชันแกว่งคทา */
    .wand-arm {
      transform-origin: 75px 65px;
      animation: floatWand 3s ease-in-out infinite;
    }

    .casting .wand-arm {
      animation: castMagic 0.6s ease-in-out infinite alternate !important;
    }

    @keyframes floatWand {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes castMagic {
      0% { transform: rotate(-5deg) scale(1); }
      100% { transform: rotate(-28deg) scale(1.1); }
    }

    /* ประกายดาวจากคทา */
    .magic-sparkles {
      position: absolute;
      top: 15px;
      right: 15px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .casting .magic-sparkles {
      opacity: 1;
    }

    .sparkle {
      position: absolute;
      font-size: 14px;
      animation: popSparkle 0.8s ease-out infinite;
    }

    .sparkle:nth-child(1) { top: -10px; left: 0px; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: -20px; left: -15px; animation-delay: 0.2s; }
    .sparkle:nth-child(3) { top: 5px; left: -25px; animation-delay: 0.4s; }

    @keyframes popSparkle {
      0% { transform: scale(0) translate(0, 0); opacity: 1; }
      100% { transform: scale(1.4) translate(-10px, -15px); opacity: 0; }
    }

    /* กล้องซ่อนไว้ (ไม่แสดงจอกล้อง) */
    #webcam {
      display: none;
    }

    /* สัญลักษณ์มินิมอลสำหรับ Gesture มือ */
    .hand-status-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #d8c7ff;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .hand-icon {
      font-size: 1.1rem;
      filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    /* การ์ดไพ่ Tarot */
    .card-display {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fadeIn 0.8s ease;
    }

    .tarot-card {
      width: 210px;
      height: 340px;
      background: rgba(20, 10, 35, 0.7);
      border: 1.5px solid var(--accent-gold);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(226, 201, 116, 0.25), inset 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
      backdrop-filter: blur(12px);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
    }

    .tarot-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 35px rgba(226, 201, 116, 0.4);
    }

    .card-header {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #a393c8;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--accent-gold);
      margin: 10px 0 2px 0;
    }

    .card-title-en {
      font-size: 0.8rem;
      color: #8f7db3;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .card-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .tag {
      font-size: 0.7rem;
      background: rgba(226, 201, 116, 0.08);
      border: 1px solid rgba(226, 201, 116, 0.2);
      color: #e2c974;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .card-meaning {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #d1c4e9;
      font-weight: 300;
      text-align: justify;
      overflow-y: auto;
      max-height: 130px;
      padding-right: 4px;
    }

    .card-meaning::-webkit-scrollbar {
      width: 3px;
    }
    .card-meaning::-webkit-scrollbar-thumb {
      background: rgba(226, 201, 116, 0.3);
      border-radius: 3px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Canvas พื้นหลังดวงดาว 3D -->
  <canvas id="stars-canvas"></canvas>

  <div class="app-container">
    
    <!-- หน้าแรก: ข้อความสอบถาม -->
    <div id="setup-screen">
      <h1>ต้องการร่ายเวทมนต์กับคุณหมีหรือไม่</h1>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="initMagicMode()">ต้องการ</button>
        <button class="btn" onclick="initTouchMode()">ไม่เป็นไร</button>
      </div>
    </div>

    <!-- น้องหมีเวทมนตร์น่ารักๆ -->
    <div id="bear-container" class="bear-wrapper">
      <div class="magic-sparkles">
        <span class="sparkle">✨</span>
        <span class="sparkle">⭐</span>
        <span class="sparkle">✨</span>
      </div>
      <svg class="bear-svg" viewBox="0 0 120 120">
        <!-- หูหมี -->
        <circle cx="35" cy="35" r="14" fill="#a47854" />
        <circle cx="35" cy="35" r="8" fill="#f3cbb0" />
        <circle cx="85" cy="35" r="14" fill="#a47854" />
        <circle cx="85" cy="35" r="8" fill="#f3cbb0" />
        
        <!-- หัวหมี -->
        <circle cx="60" cy="55" r="32" fill="#bc8c65" />
        
        <!-- หมวกจอมเวท -->
        <path d="M 32 40 Q 60 10 88 40 Z" fill="#2d124d" stroke="#e2c974" stroke-width="1.5"/>
        <ellipse cx="60" cy="40" rx="30" ry="6" fill="#190c2e" stroke="#e2c974" stroke-width="1.5"/>
        <circle cx="60" cy="18" r="3" fill="#e2c974" />
        
        <!-- ตา & จมูก -->
        <circle cx="48" cy="52" r="3.5" fill="#2c1a0e" />
        <circle cx="72" cy="52" r="3.5" fill="#2c1a0e" />
        <circle cx="50" cy="50" r="1" fill="#ffffff" />
        <circle cx="74" cy="50" r="1" fill="#ffffff" />
        
        <ellipse cx="60" cy="60" rx="9" ry="6" fill="#f3cbb0" />
        <ellipse cx="60" cy="58" rx="4" ry="2.5" fill="#2c1a0e" />
        <path d="M 57 62 Q 60 65 63 62" stroke="#2c1a0e" stroke-width="1.5" fill="none" />
        
        <!-- แก้มชมพู -->
        <circle cx="42" cy="58" r="4" fill="#ffb3ba" opacity="0.6" />
        <circle cx="78" cy="58" r="4" fill="#ffb3ba" opacity="0.6" />

        <!-- ตัวหมี -->
        <path d="M 40 85 Q 60 75 80 85 L 85 110 Q 60 115 35 110 Z" fill="#a47854" />
        
        <!-- แขนและคทาเวทมนตร์ (ด้ามขวาโบกได้) -->
        <g class="wand-arm">
          <path d="M 72 75 L 95 55" stroke="#795548" stroke-width="3.5" stroke-linecap="round" />
          <polygon points="95,47 98,53 104,55 98,57 95,63 92,57 86,55 92,53" fill="#e2c974" />
          <path d="M 70 78 Q 80 72 85 62" stroke="#bc8c65" stroke-width="7" stroke-linecap="round" fill="none" />
        </g>
        
        <!-- แขนซ้าย -->
        <path d="M 50 78 Q 40 85 38 95" stroke="#bc8c65" stroke-width="7" stroke-linecap="round" fill="none" />
      </svg>
    </div>

    <!-- แถบแสดงสถานะมือ (มินิมอล) -->
    <div id="hand-status" class="hand-status-badge">
      <span id="hand-icon" class="hand-icon">✋</span>
      <span id="hand-text">กำลังค้นหามือ...</span>
    </div>

    <!-- ส่วนแสดงการ์ดไพ่ -->
    <div id="card-display" class="card-display">
      <div class="tarot-card" onclick="triggerMagicDraw()">
        <div class="card-header" id="card-arcana">MAJOR ARCANA</div>
        <div>
          <div class="card-title" id="card-name-th">แตะเพื่อเสี่ยงทาย</div>
          <div class="card-title-en" id="card-name-en">Tap or Gestures to Draw</div>
          <div class="card-keywords" id="card-keywords">
            <span class="tag">ชะตาชีวิต</span>
            <span class="tag">คำตอบ</span>
          </div>
        </div>
        <div class="card-meaning" id="card-meaning">
          แตะที่ไพ่ หรือกำมือ (✊) ให้คุณหมีร่ายเวทมนตร์สุ่มไพ่ให้คุณ
        </div>
      </div>

      <button class="btn" style="margin-top: 20px;" onclick="triggerMagicDraw()">🔮 สุ่มไพ่ใบใหม่</button>
    </div>

  </div>

  <video id="webcam" playsinline></video>

  <script>
    /* ==========================================
       1. ฐานข้อมูลไพ่ JSON ในตัว
       ========================================== */
    const tarotDeck = [
      { id: "m00", arcana: "Major Arcana", nameEn: "The Fool", nameTh: "ผู้เริ่มต้น", keywords: ["จุดเริ่มต้น", "อิสระ", "การเสี่ยงโชค"], meaning: "คุณกำลังยืนอยู่ตรงจุดเริ่มต้นของการเดินทางครั้งใหม่ในชีวิต ปล่อยวางความกลัวและเชื่อมั่นในสัญชาตญาณ" },
      { id: "m01", arcana: "Major Arcana", nameEn: "The Magician", nameTh: "นักมายากล", keywords: ["ศักยภาพ", "การลงมือทำ", "ไหวพริบ"], meaning: "ทรัพยากรทุกอย่างพร้อมแล้วในมือคุณ จงมั่นใจและเริ่มแปรเปลี่ยนความฝันให้กลายเป็นความจริง" },
      { id: "m02", arcana: "Major Arcana", nameEn: "The High Priestess", nameTh: "นักบวชหญิง", keywords: ["สัญชาตญาณ", "ความเงียบ", "ปัญญาภายใน"], meaning: "คำตอบซ่อนอยู่ในจิตใจของคุณ รับฟังเสียงสัญชาตญาณและสังเกตการณ์อย่างเงียบๆ" },
      { id: "m03", arcana: "Major Arcana", nameEn: "The Empress", nameTh: "จักรพรรดินี", keywords: ["ความอุดมสมบูรณ์", "ความรัก", "การเติบโต"], meaning: "ช่วงเวลาแห่งผลลัพธ์และการดูแลเอาใจใส่ สิ่งที่คุณปลูกไว้นั้นกำลังเติบโตและงอกงาม" },
      { id: "m04", arcana: "Major Arcana", nameEn: "The Emperor", nameTh: "จักรพรรดิ", keywords: ["โครงสร้าง", "ระเบียบวินัย", "อำนาจ"], meaning: "ใช้ความเด็ดขาดและระเบียบวินัยในการจัดระเบียบชีวิต คุณมีอำนาจในการควบคุมสถานการณ์" },
      { id: "m06", arcana: "Major Arcana", nameEn: "The Lovers", nameTh: "คู่รัก", keywords: ["ความสัมพันธ์", "ทางเลือก", "ความสอดคล้อง"], meaning: "สื่อถึงความผูกพันและการเลือกที่มาจากหัวใจ จงเลือกทางเดินที่ซื่อสัตย์ต่อค่านิยมของตนเอง" },
      { id: "m07", arcana: "Major Arcana", nameEn: "The Chariot", nameTh: "อัศวินรถศึก", keywords: ["ความมุ่งมั่น", "ชัยชนะ", "การควบคุม"], meaning: "มุ่งหน้าไปข้างหน้าด้วยเจตจำนงที่แรงกล้า การควบคุมอารมณ์และวินัยจะนำพาชัยชนะมาให้" },
      { id: "m10", arcana: "Major Arcana", nameEn: "Wheel of Fortune", nameTh: "กงล้อแห่งโชคชะตา", keywords: ["การเปลี่ยนแปลง", "โชคชะตา", "โอกาสใหม่"], meaning: "วัฏจักรชีวิตกำลังหมุนเปลี่ยน ยอมรับความไม่แน่นอนและเปิดรับโอกาสใหม่ๆ ที่กำลังเข้ามา" },
      { id: "m17", arcana: "Major Arcana", nameEn: "The Star", nameTh: "ดวงดาวแห่งความหวัง", keywords: ["ความหวัง", "การเยียวยา", "แรงบันดาลใจ"], meaning: "พายุร้ายได้ผ่านพ้นไปแล้ว แสงสว่างและความสงบกำลังกลับคืนมา จงศรัทธาในอนาคต" },
      { id: "m19", arcana: "Major Arcana", nameEn: "The Sun", nameTh: "ดวงอาทิตย์", keywords: ["ความสำเร็จ", "ความสุข", "พลังชีวิต"], meaning: "ไพ่แห่งความโชคดีและความสดใส ทุกสิ่งที่ทำจะได้รับผลตอบแทนงดงาม เต็มไปด้วยพลังบวก" },
      { id: "m21", arcana: "Major Arcana", nameEn: "The World", nameTh: "โลกสมบูรณ์", keywords: ["ความสำเร็จสมบูรณ์", "บรรลุเป้าหมาย", "ความกลมกลืน"], meaning: "การเดินทางยาวนานบรรลุผลสำเร็จ คุณพร้อมแล้วสำหรับการก้าวเข้าสู่บทใหม่ของชีวิต" }
    ];

    /* ==========================================
       2. ระบบดาว 3D (Canvas)
       ========================================== */
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Star {
      constructor() {
        this.x = (Math.random() - 0.5) * canvas.width * 2;
        this.y = (Math.random() - 0.5) * canvas.height * 2;
        this.z = Math.random() * canvas.width;
        this.size = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random();
        this.speed = 0.5;
      }

      update() {
        this.z -= this.speed;
        if (this.z <= 0) {
          this.z = canvas.width;
          this.x = (Math.random() - 0.5) * canvas.width * 2;
          this.y = (Math.random() - 0.5) * canvas.height * 2;
        }
      }

      draw() {
        const sx = (this.x / this.z) * canvas.width + canvas.width / 2;
        const sy = (this.y / this.z) * canvas.height + canvas.height / 2;
        const radius = (1 - this.z / canvas.width) * this.size * 2;

        if (sx >= 0 && sx <= canvas.width && sy >= 0 && sy <= canvas.height) {
          ctx.beginPath();
          ctx.arc(sx, sy, Math.max(0.2, radius), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(226, 201, 116, ${this.alpha})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = "#e2c974";
          ctx.fill();
        }
      }
    }

    function initStars() {
      resizeCanvas();
      stars = Array.from({ length: 150 }, () => new Star());
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.update();
        star.draw();
      });
      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', resizeCanvas);
    initStars();
    animateStars();

    /* ==========================================
       3. การสุ่มและแสดงผลไพ่ + แอนิเมชันหมีร่ายเวท
       ========================================== */
    function triggerMagicDraw() {
      const bearContainer = document.getElementById('bear-container');
      bearContainer.classList.add('casting');
      
      drawCard();
      
      setTimeout(() => {
        bearContainer.classList.remove('casting');
      }, 1000);
    }

    function drawCard() {
      const randomIndex = Math.floor(Math.random() * tarotDeck.length);
      const card = tarotDeck[randomIndex];

      const cardElement = document.querySelector('.tarot-card');
      cardElement.style.transform = 'scale(0.95)';
      
      setTimeout(() => {
        document.getElementById('card-arcana').innerText = card.arcana;
        document.getElementById('card-name-th').innerText = card.nameTh;
        document.getElementById('card-name-en').innerText = card.nameEn;
        document.getElementById('card-meaning').innerText = card.meaning;
        
        const keywordsHTML = card.keywords.map(k => `<span class="tag">${k}</span>`).join('');
        document.getElementById('card-keywords').innerHTML = keywordsHTML;

        cardElement.style.transform = 'scale(1)';
      }, 200);
    }

    function initTouchMode() {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('bear-container').style.display = 'flex';
      document.getElementById('card-display').style.display = 'flex';
      drawCard();
    }

    /* ==========================================
       4. ระบบตรวจจับท่าทางมือ (ซ่อนกล้อง)
       ========================================== */
    let lastGestureTime = 0;

    function initMagicMode() {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('bear-container').style.display = 'flex';
      document.getElementById('hand-status').style.display = 'flex';
      document.getElementById('card-display').style.display = 'flex';
      
      const videoElement = document.getElementById('webcam');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onHandResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      camera.start()
        .then(() => {
          document.getElementById('hand-text').innerText = "พร้อมร่ายเวทมนตร์ (แบ/กำมือ)";
        })
        .catch(err => {
          document.getElementById('hand-text').innerText = "ใช้ระบบแตะสัมผัส";
        });
        
      drawCard();
    }

    function onHandResults(results) {
      const iconEl = document.getElementById('hand-icon');
      const textEl = document.getElementById('hand-text');
      const bearContainer = document.getElementById('bear-container');

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        const indexTip = landmarks[8];
        const wrist = landmarks[0];
        const distance = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y);

        const now = Date.now();

        if (distance < 0.25) { 
          // ท่ากำมือ ✊ -> น้องหมีร่ายเวทสุ่มไพ่
          iconEl.innerText = "✊";
          textEl.innerText = "คุณหมีกำลังร่ายเวทมนตร์...";
          bearContainer.classList.add('casting');
          
          if (now - lastGestureTime > 1500) {
            drawCard();
            lastGestureTime = now;
          }
        } else {
          // ท่าแบมือ ✋
          iconEl.innerText = "✋";
          textEl.innerText = "กำมือเพื่อสุ่มไพ่";
          bearContainer.classList.remove('casting');
        }
      } else {
        iconEl.innerText = "✨";
        textEl.innerText = "กำลังค้นหามือ...";
        bearContainer.classList.remove('casting');
      }
    }
  </script>
</body>
</html>
