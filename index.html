<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arcanum · ไพ่ยิปซี 78 ใบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Charmonman:wght@400;700&family=Taviraj:wght@300;400;500;600&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink-void:#0a0618;
  --ink-deep:#150c2e;
  --ink-mid:#241546;
  --violet:#6b3fa0;
  --gold:#c9a54d;
  --gold-bright:#e8c877;
  --parchment:#f0e6d8;
  --text-soft:#cdc0e8;
  --cups:#2e7d6b;
  --wands:#c1531b;
  --swords:#5c7a99;
  --pentacles:#7a8f3a;
  --major:#8a5fc2;
  --h1: 44px;
  --h2: 26px;
  --h3: 18px;
  --body: 16px;
  --small: 13px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  height:100%;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(107,63,160,.25), transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(46,125,107,.15), transparent 50%),
    linear-gradient(180deg, var(--ink-void) 0%, var(--ink-deep) 55%, var(--ink-mid) 100%);
  color:var(--parchment);
  font-family:'EB Garamond', serif;
  overflow-x:hidden;
  min-height:100vh;
}
body{ position:relative; }
.star-field{ position:fixed; inset:0; pointer-events:none; z-index:0; }
.star{
  position:absolute; width:2px; height:2px; border-radius:50%;
  background:var(--parchment); opacity:.5;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.15; transform:scale(1);}
  50%{opacity:.9; transform:scale(1.6);}
}
.wrap{
  position:relative; z-index:1;
  max-width:1000px; margin:0 auto;
  padding:30px 20px 80px;
  display:flex; flex-direction:column; align-items:center;
  text-align:center;
}
.eyebrow-line{
  width:64px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin:0 auto 12px;
}
h1.title{
  font-family:'Cinzel Decorative', serif;
  font-size:var(--h1);
  font-weight:700;
  letter-spacing:.03em;
  color:var(--gold-bright);
  text-shadow:0 0 30px rgba(201,165,77,.35);
  line-height:1.15;
}
.title-th{ font-family:'Charmonman', cursive; font-size:24px; color:var(--text-soft); margin-top:2px; }
.subtitle{
  font-family:'Taviraj', serif; font-weight:300; font-size:var(--body);
  color:var(--text-soft); max-width:520px; margin:12px auto 0; line-height:1.6;
}

/* เวทีแสดงผลวงรี */
.stage{
  position:relative; width:100%; height:380px; margin-top:20px;
  display:flex; align-items:center; justify-content:center;
}
.deck-glow{
  position:absolute; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(201,165,77,.2), transparent 70%);
  filter:blur(8px); animation:pulse-glow 3.5s ease-in-out infinite;
}
@keyframes pulse-glow{
  0%,100%{opacity:.5; transform:scale(1);}
  50%{opacity:.9; transform:scale(1.15);}
}
.ring-container{ position:relative; width:100%; height:100%; }

.deck{
  position:absolute; top:50%; left:50%; width:100px; height:155px;
  transform:translate(-50%, -50%);
  cursor:pointer; z-index:2; transition:opacity 0.4s ease;
}
.deck-card{
  position:absolute; inset:0; border-radius:9px;
  background:
    linear-gradient(135deg, var(--ink-mid), var(--ink-deep) 60%),
    repeating-linear-gradient(45deg, rgba(201,165,77,.06) 0 2px, transparent 2px 14px);
  border:1.5px solid var(--gold);
  box-shadow:0 8px 20px rgba(0,0,0,.6), inset 0 0 0 1px rgba(201,165,77,.15);
  display:flex; align-items:center; justify-content:center;
}
.deck-card::before{
  content:''; position:absolute; inset:7px;
  border:1px solid rgba(201,165,77,.5); border-radius:5px;
}
.deck-card .sigil{ width:36px; height:36px; opacity:.85; color:var(--gold); }
.deck-hint{
  position:absolute; bottom:-35px; left:50%; transform:translateX(-50%);
  white-space:nowrap; font-family:'Taviraj', serif; font-size:var(--small);
  color:var(--text-soft); opacity:.9;
}

/* ไพ่วงรีแนวนอนกระจายตัว */
.ring-card{
  position:absolute; top:50%; left:50%;
  width:70px; height:110px; border-radius:7px;
  background:
    linear-gradient(135deg, var(--ink-mid), var(--ink-deep) 60%),
    repeating-linear-gradient(45deg, rgba(201,165,77,.06) 0 2px, transparent 2px 14px);
  border:1.2px solid var(--gold);
  box-shadow:0 4px 12px rgba(0,0,0,.7);
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; transition:opacity 0.3s ease;
  will-change:transform; opacity:0;
}
.ring-card::before{
  content:''; position:absolute; inset:4px;
  border:1px solid rgba(201,165,77,.4); border-radius:4px;
}
.ring-card .sigil{ width:22px; height:22px; color:var(--gold); opacity:.75;}

/* ปุ่มและแผงควบคุม */
.gesture-panel{
  position:fixed; right:20px; bottom:20px; z-index:20; width:160px;
  background:rgba(10,6,24,.88); border:1px solid rgba(201,165,77,.4);
  border-radius:12px; padding:10px; backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.gesture-panel video, .gesture-panel canvas{
  width:100%; border-radius:8px; display:block; transform:scaleX(-1);
}
.gesture-panel canvas{ position:absolute; top:10px; left:10px; width:calc(100% - 20px); }
.gesture-label{
  font-family:'Taviraj', serif; font-size:12px; color:var(--gold-bright);
  text-align:center; margin-top:6px; line-height:1.3;
}
.gesture-status{
  font-size:11px; color:var(--text-soft); text-align:center; margin-top:3px; opacity:.85;
}
.control-btns{ display:flex; gap:6px; margin-top:8px; }
.action-btn{
  flex:1; background:transparent; border:1px solid rgba(201,165,77,.4);
  color:var(--text-soft); font-family:'Taviraj',serif; font-size:11px;
  padding:5px 0; border-radius:6px; cursor:pointer; text-align:center;
}
.action-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

/* Popup แสดงคำทำนายเชิงลึกยาวๆ */
.overlay{
  position:fixed; inset:0; z-index:50; background:rgba(5,3,14,.85);
  backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center;
  padding:20px; opacity:0; pointer-events:none; transition:opacity .35s ease;
}
.overlay.show{ opacity:1; pointer-events:auto; }
.card-popup{
  width:100%; max-width:540px; max-height:88vh; overflow-y:auto;
  background:linear-gradient(165deg, var(--ink-mid), var(--ink-deep));
  border:1.5px solid var(--gold); border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.8), 0 0 40px rgba(201,165,77,.2);
  padding:30px 24px 24px; position:relative;
  transform:scale(.9) translateY(20px); transition:transform .4s cubic-bezier(.2,.9,.25,1.1);
}
.overlay.show .card-popup{ transform:scale(1) translateY(0); }
.popup-close{
  position:absolute; top:14px; right:16px; background:none; border:none;
  color:var(--text-soft); font-size:24px; cursor:pointer; line-height:1;
}
.popup-close:hover{ color:var(--gold-bright); }
.popup-icon-wrap{
  width:68px; height:68px; margin:0 auto 14px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--suit-color, var(--gold));
  box-shadow:0 0 20px var(--suit-color, rgba(201,165,77,.4));
}
.popup-icon-wrap svg{ width:34px; height:34px; color:var(--suit-color, var(--gold)); }
.popup-arcana-tag{
  font-family:'Taviraj', serif; font-size:var(--small); letter-spacing:.08em;
  color:var(--suit-color, var(--gold)); text-align:center; margin-bottom:4px;
}
.popup-name-en{
  font-family:'Cinzel', serif; font-weight:600; font-size:var(--h2);
  text-align:center; color:var(--gold-bright); line-height:1.2;
}
.popup-name-th{ font-family:'Charmonman', cursive; font-size:22px; text-align:center; color:var(--parchment); margin-top:2px; }
.popup-divider{
  width:40px; height:1px; margin:14px auto;
  background:linear-gradient(90deg, transparent, var(--suit-color, var(--gold)), transparent);
}
.popup-keywords{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:16px; }
.popup-keywords span{
  font-family:'Taviraj', serif; font-size:var(--small);
  border:1px solid rgba(205,192,232,.3); color:var(--text-soft);
  padding:2px 10px; border-radius:14px;
}
.popup-section-title{ font-family:'Cinzel', serif; font-size:var(--h3); color:var(--gold-bright); margin-bottom:8px; text-align:center; }
.popup-meaning{ font-family:'Taviraj', serif; font-weight:300; font-size:var(--body); color:var(--parchment); line-height:1.8; margin-bottom:20px; text-align:justify; white-space:pre-line; }
.popup-actions{ display:flex; gap:10px; justify-content:center; }
.popup-actions button{
  font-family:'Cinzel', serif; font-size:13px;
  padding:9px 18px; border-radius:8px; cursor:pointer;
  background:transparent; color:var(--gold-bright); border:1px solid var(--gold);
}
.popup-actions button:hover{ background:var(--gold); color:var(--ink-void); }
.popup-actions button.secondary{ border-color:rgba(205,192,232,.35); color:var(--text-soft); }

footer.credit{ margin-top:30px; font-family:'Taviraj', serif; font-size:12px; color:rgba(205,192,232,.45); }

@media (max-width:600px){
  :root{ --h1:32px; --h2:22px; --body:14px; }
  .stage{ height:320px; }
  .gesture-panel{ width:130px; right:10px; bottom:10px; }
}
</style>
</head>
<body>
<div class="star-field" id="starField"></div>

<div class="wrap">
  <div class="eyebrow-line"></div>
  <h1 class="title">ARCANUM</h1>
  <div class="title-th">ไพ่ยิปซี 78 ใบ</div>
  <p class="subtitle">
    ✋ <b>กางมือ</b> เพื่อเริ่มสุ่มวนกองไพ่เป็นวงรี / ✊ <b>กำมือ</b> เพื่อหยุดและเปิดคำทำนาย<br>
    (หรือคลิกที่กองไพ่ / ใช้ปุ่มควบคุมมุมขวาล่างได้)
  </p>

  <div class="stage">
    <div class="deck-glow"></div>
    <div class="ring-container" id="ringContainer">
      <div class="deck" id="deck"></div>
    </div>
  </div>

  <footer class="credit">Arcanum Tarot · เพื่อความบันเทิงและการใคร่ครวญส่วนตัว</footer>
</div>

<div class="gesture-panel">
  <div style="position:relative;">
    <video id="camVideo" autoplay playsinline muted></video>
    <canvas id="camCanvas"></canvas>
  </div>
  <div class="gesture-label" id="gestureLabel">✋ กางมือ: สุ่ม<br>✊ กำมือ: หยุด</div>
  <div class="gesture-status" id="gestureStatus">กำลังเปิดกล้อง…</div>
  <div class="control-btns">
    <button class="action-btn" id="startClickBtn">เริ่มสุ่ม</button>
    <button class="action-btn" id="stopClickBtn">หยุดไพ่</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card-popup">
    <button class="popup-close" id="popupClose">&times;</button>
    <div class="popup-icon-wrap" id="popupIconWrap"></div>
    <div class="popup-arcana-tag" id="popupTag"></div>
    <div class="popup-name-en" id="popupNameEn"></div>
    <div class="popup-name-th" id="popupNameTh"></div>
    <div class="popup-divider"></div>
    <div class="popup-keywords" id="popupKeywords"></div>
    <div class="popup-section-title">คำทำนายและความหมายเชิงลึก</div>
    <div class="popup-meaning" id="popupMeaning"></div>
    <div class="popup-actions">
      <button class="secondary" id="closeBtn">ปิด</button>
      <button id="drawAgainBtn">ทำนายใหม่</button>
    </div>
  </div>
</div>

<script>
/* ================= สัญลักษณ์ SVG ================= */
const ICONS = {
  chalice: '<path d="M14 8h20l-2 14a8 8 0 0 1-16 0L14 8Z"/><path d="M24 30v9"/><path d="M16 39h16"/>',
  sword: '<path d="M24 4v30"/><path d="M15 12h18"/><path d="M20 34l4 6 4-6"/><circle cx="24" cy="38" r="2.2"/>',
  wand: '<path d="M14 38 34 10"/><path d="M30 6l2 4 4 2-4 2-2 4-2-4-4-2 4-2Z"/>',
  coin: '<circle cx="24" cy="24" r="16"/><path d="M24 12l4.5 9.4L38 23l-7 6.8L32.6 40 24 34.8 15.4 40 17 29.8 10 23l9.5-1.6L24 12Z"/>',
  star: '<path d="M24 6l4.9 12.6L42 20l-10 8.4L35.3 42 24 34.6 12.7 42 16 28.4 6 20l13.1-1.4L24 6Z"/>',
  feather: '<path d="M34 6C18 10 12 26 10 42c14-2 26-10 28-24"/><path d="M14 38 32 10"/>',
  infinity: '<path d="M15 24a7 7 0 1 1 0-.1M33 24a7 7 0 1 0 0-.1M15 24c4-8 14-8 18 0M15 24c4 8 14 8 18 0" fill="none"/>',
};

function iconSvg(name){
  const inner = ICONS[name] || ICONS.star;
  return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

const SUITS = {
  cups:      {th:'ถ้วย',   color:'var(--cups)'},
  wands:     {th:'คทา',    color:'var(--wands)'},
  swords:    {th:'ดาบ',    color:'var(--swords)'},
  pentacles: {th:'เหรียญ', color:'var(--pentacles)'},
};

/* ================= ดึงข้อมูลไพ่จากไฟล์ JSON 외부 ================= */
let ALL_CARDS = [];
fetch('cards-data.json')
  .then(res => res.json())
  .then(data => { ALL_CARDS = data; })
  .catch(err => console.error("ไม่สามารถโหลดไฟล์ข้อมูลไพ่ได้:", err));

/* ================= ดาวหลังฉาก ================= */
(function initStars(){
  const field = document.getElementById('starField');
  let html = '';
  for(let i=0; i<80; i++){
    const top = Math.random()*100, left = Math.random()*100;
    const delay = (Math.random()*4).toFixed(2);
    const dur = (3+Math.random()*3).toFixed(2);
    html += `<div class="star" style="top:${top}%; left:${left}%; animation-delay:${delay}s; animation-duration:${dur}s;"></div>`;
  }
  field.innerHTML = html;
})();

/* ================= การวนไพ่วงรีแนวนอน ================= */
const deckEl = document.getElementById('deck');
const ringContainer = document.getElementById('ringContainer');
const RING_COUNT = 24;
let ringCardEls = [];
let isSpinning = false;
let rotationAngle = 0;
let animationFrameId = null;

for(let i=0; i<5; i++){
  const d = document.createElement('div');
  d.className = 'deck-card';
  d.style.transform = `translate(${-i*0.5}px, ${-i*1.2}px)`;
  if(i===4) d.innerHTML = `<span class="sigil">${iconSvg('star')}</span><div class="deck-hint">แตะเพื่อสุ่มไพ่</div>`;
  deckEl.appendChild(d);
}

function createRingCards(){
  ringCardEls.forEach(el => el.remove());
  ringCardEls = [];
  for(let i=0; i<RING_COUNT; i++){
    const card = document.createElement('div');
    card.className = 'ring-card';
    card.innerHTML = `<span class="sigil">${iconSvg('star')}</span>`;
    ringContainer.appendChild(card);
    ringCardEls.push(card);
  }
}
createRingCards();

function updateRingPositions(){
  const isMobile = window.innerWidth < 600;
  const radiusX = isMobile ? window.innerWidth * 0.4 : 380;
  const radiusY = isMobile ? 65 : 90;

  ringCardEls.forEach((card, i) => {
    const angleRad = ((i / RING_COUNT) * 360 + rotationAngle) * (Math.PI / 180);
    const x = Math.cos(angleRad) * radiusX;
    const y = Math.sin(angleRad) * radiusY;
    card.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  });
}

function startSpread(){
  if(isSpinning) return;
  isSpinning = true;
  deckEl.style.opacity = '0';
  ringCardEls.forEach(card => card.style.opacity = '1');

  function spinLoop(){
    if(!isSpinning) return;
    rotationAngle = (rotationAngle + 0.7) % 360;
    updateRingPositions();
    animationFrameId = requestAnimationFrame(spinLoop);
  }
  spinLoop();
}

function stopSpreadAndPick(){
  if(!isSpinning) return;
  isSpinning = false;
  if(animationFrameId) cancelAnimationFrame(animationFrameId);

  if(ALL_CARDS.length === 0){
    alert("กำลังโหลดข้อมูลไพ่ กรุณาลองใหม่อีกครั้ง");
    return;
  }

  const cardPicked = ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)];
  
  ringCardEls.forEach(el => el.style.opacity = '0');
  setTimeout(() => {
    deckEl.style.opacity = '1';
    openPopup(cardPicked);
  }, 300);
}

deckEl.addEventListener('click', () => {
  if(!isSpinning) startSpread();
  else stopSpreadAndPick();
});

document.getElementById('startClickBtn').addEventListener('click', startSpread);
document.getElementById('stopClickBtn').addEventListener('click', stopSpreadAndPick);

/* ================= POPUP แสดงผลคำทำนาย ================= */
const overlay = document.getElementById('overlay');
function openPopup(card){
  const isMajor = card.arcana === 'major';
  const suitInfo = isMajor ? {color:'var(--major)'} : (SUITS[card.suit] || {color:'var(--gold)'});
  
  document.documentElement.style.setProperty('--suit-color', suitInfo.color);
  document.getElementById('popupIconWrap').style.setProperty('--suit-color', suitInfo.color);
  document.getElementById('popupIconWrap').innerHTML = iconSvg(card.icon);
  
  document.getElementById('popupTag').textContent = isMajor ? `Major Arcana · ไพ่ชุดใหญ่` : `Minor Arcana · ตระกูล${SUITS[card.suit] ? SUITS[card.suit].th : ''}`;
  document.getElementById('popupTag').style.color = suitInfo.color;
  
  document.getElementById('popupNameEn').textContent = card.nameEn;
  document.getElementById('popupNameTh').textContent = card.nameTh;
  
  document.getElementById('popupKeywords').innerHTML = card.keywords.map(k=>`<span>${k}</span>`).join('');
  document.getElementById('popupMeaning').textContent = card.meaning;
  
  overlay.classList.add('show');
}

function closePopup(){ overlay.classList.remove('show'); }
document.getElementById('popupClose').addEventListener('click', closePopup);
document.getElementById('closeBtn').addEventListener('click', closePopup);
document.getElementById('drawAgainBtn').addEventListener('click', ()=>{
  closePopup();
  setTimeout(startSpread, 300);
});
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closePopup(); });

/* ================= การตรวจจับสัญญาณมือ (MediaPipe) ================= */
const gestureStatus = document.getElementById('gestureStatus');
const camVideo = document.getElementById('camVideo');
const camCanvas = document.getElementById('camCanvas');
let handsInstance = null;

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
  });
}

async function initCameraAndGesture(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' } });
    camVideo.srcObject = stream;
    await camVideo.play();

    await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');

    handsInstance = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    handsInstance.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    handsInstance.onResults(onHandResults);

    gestureStatus.textContent = 'พร้อมรับสัญญาณมือ ✋/✊';

    async function processFrame(){
      if(camVideo.readyState >= 2){
        await handsInstance.send({ image: camVideo });
      }
      requestAnimationFrame(processFrame);
    }
    processFrame();
  } catch(err) {
    gestureStatus.textContent = 'ไม่พบกล้อง · ใช้ปุ่มกดแทน';
  }
}

let openHandFrames = 0;
let fistFrames = 0;

function onHandResults(results){
  const ctx = camCanvas.getContext('2d');
  camCanvas.width = camVideo.videoWidth || 320;
  camCanvas.height = camVideo.videoHeight || 240;
  ctx.clearRect(0, 0, camCanvas.width, camCanvas.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const landmarks = results.multiHandLandmarks[0];
    
    ctx.fillStyle = '#e8c877';
    landmarks.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x * camCanvas.width, p.y * camCanvas.height, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    const wrist = landmarks[0];
    const tips = [8, 12, 16, 20];
    let isOpen = true;
    let isFist = true;

    tips.forEach(idx => {
      const dist = Math.hypot(landmarks[idx].x - wrist.x, landmarks[idx].y - wrist.y);
      if (dist < 0.32) isOpen = false;
      if (dist > 0.26) isFist = false;
    });

    if (isOpen) {
      openHandFrames++;
      fistFrames = 0;
      gestureStatus.textContent = '✋ ตรวจพบกางมือ… เริ่มวนสุ่ม';
      if (openHandFrames >= 5 && !isSpinning) {
        startSpread();
      }
    } else if (isFist) {
      fistFrames++;
      openHandFrames = 0;
      gestureStatus.textContent = '✊ ตรวจพบกำมือ… หยุดเปิดคำทำนาย';
      if (fistFrames >= 5 && isSpinning) {
        stopSpreadAndPick();
      }
    } else {
      openHandFrames = 0;
      fistFrames = 0;
      gestureStatus.textContent = 'กำลังตรวจจับสัญญาณมือ…';
    }
  } else {
    openHandFrames = 0;
    fistFrames = 0;
    gestureStatus.textContent = 'ยื่นมือเข้ากล้อง ✋/✊';
  }
}

window.addEventListener('load', initCameraAndGesture);
</script>

</html>
