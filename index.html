<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcana Mystic - Tarot Oracle 78</title>
    
    <!-- Fonts & MediaPipe Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-primary: #0a051b;
            --accent-gold: #ffd700;
            --accent-purple: #4b0082;
            --text-gold: #f3e5ab;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a0933 0%, var(--bg-primary) 100%);
            color: #fff;
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            color: var(--accent-gold);
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-top: 20px;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        .status-panel {
            font-size: 1.1rem;
            color: var(--text-gold);
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
            z-index: 10;
        }

        /* Camera Feed (Background tracking) */
        #webcam { display: none; }
        
        /* Card Deck Container */
        .stage {
            position: relative;
            width: 100vw;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .deck {
            position: relative;
            width: 120px;
            height: 200px;
            cursor: pointer;
        }

        .card {
            position: absolute;
            width: 120px;
            height: 200px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2b1055, #7597de);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s, left 0.5s;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .card::after {
            content: '🔮';
            font-size: 2rem;
        }

        /* Modal Pop-up */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(145deg, #150d2a, #26134b);
            border: 2px solid var(--accent-gold);
            border-radius: 15px;
            padding: 30px;
            max-width: 480px;
            width: 85%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            animation: fadeIn 0.4s ease;
        }

        .modal-title-en {
            font-family: 'Cinzel Decorative', cursive;
            color: var(--accent-gold);
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 1px;
        }

        .modal-title-th {
            font-size: 1.2rem;
            color: var(--text-gold);
            margin-top: 5px;
            font-weight: 300;
        }

        .modal-body {
            font-size: 1rem;
            line-height: 1.6;
            margin: 20px 0;
            color: #e0e0e0;
            text-align: justify;
            text-align-last: center;
        }

        .close-btn {
            background: var(--accent-gold);
            color: var(--bg-primary);
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Prompt', sans-serif;
        }

        .close-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>ARCANA MYSTIC TAROT</h1>
    <div class="status-panel" id="status">คลิกที่กองไพ่ หรือ แบมือ ✋ หน้ากล้องเพื่อเริ่มสุ่ม</div>

    <div class="stage">
        <div class="deck" id="deck" onclick="startSpread()"></div>
    </div>

    <video id="webcam" autoplay playsinline></video>

    <!-- Popup Detail -->
    <div class="modal" id="cardModal">
        <div class="modal-content">
            <h2 class="modal-title-en" id="cardTitleEn">THE FOOL</h2>
            <div class="modal-title-th" id="cardTitleTh">เดอะ ฟูล (0)</div>
            <p class="modal-body" id="cardMeaning">ความหมายของไพ่...</p>
            <button class="close-btn" onclick="closeModal()">รับคำทำนาย</button>
        </div>
    </div>

    <script>
        // Data Base: 78 Tarot Cards
        const tarotData = [
            { id: 0, en: "The Fool", th: "เดอะ ฟูล (0)", desc: "การเริ่มต้นใหม่ อิสรภาพ การเสี่ยงโชค และการเดินทางโดยไร้กังวล" },
            { id: 1, en: "The Magician", th: "เดอะ เมจิเชียน (1)", desc: "ความสามารถ ทักษะ การสร้างสรรค์ และการเนรมิตเป้าหมายให้เป็นจริง" },
            { id: 2, en: "The High Priestess", th: "เดอะ ไฮพรีสเตส (2)", desc: "สัญชาตญาณ ความลึกลับ ความคิดภายใน และความหยั่งรู้" },
            { id: 3, en: "The Empress", th: "ดิ เอ็มเพรส (3)", desc: "ความอุดมสมบูรณ์ การเติบโต ธรรมชาติ และความเสน่หา" },
            { id: 4, en: "The Emperor", th: "ดิ เอ็มเพอเรอร์ (4)", desc: "อำนาจ โครงสร้าง ความมั่นคง และการเป็นผู้นำ" }
        ];

        // เติมข้อมูลจำลองให้ครบ 78 ใบ
        for(let i = 5; i < 78; i++) {
            tarotData.push({
                id: i,
                en: `Arcana Card ${i}`,
                th: `ไพ่ยิปซีใบที่ ${i}`,
                desc: "พลังแห่งชะตาชีวิตและโชคชะตากำลังนำทางคุณไปสู่คำตอบที่แสวงหา..."
            });
        }

        const deckContainer = document.getElementById('deck');
        let cards = [];
        let isSpinning = false;
        let rotationAngle = 0;
        let spinInterval;

        // Render 78 Cards Deck
        function createDeck() {
            deckContainer.innerHTML = '';
            cards = [];
            for (let i = 0; i < 78; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.top = `${-i * 0.2}px`;
                card.style.left = `${-i * 0.2}px`;
                deckContainer.appendChild(card);
                cards.push(card);
            }
        }
        createDeck();

        // Spread Cards & Start Rotation Animation
        function startSpread() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('status').innerText = "กำมือ ✊ หน้ากล้องเพื่อหยุดไพ่!";

            const radius = 220;
            cards.forEach((card, i) => {
                const angle = (i / 78) * (2 * Math.PI);
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);

                card.style.transform = `translate(${x}px, ${y}px)`;
            });

            spinInterval = setInterval(() => {
                rotationAngle += 1.5;
                deckContainer.style.transform = `rotate(${rotationAngle}deg)`;
                
                cards.forEach(card => {
                    card.style.transform += ` rotate(${-1.5}deg)`;
                });
            }, 30);
        }

        // Stop & Pick Random Card
        function stopAndPickCard() {
            if (!isSpinning) return;
            isSpinning = false;
            clearInterval(spinInterval);

            document.getElementById('status').innerText = "กำลังเปิดคำทำนาย...";

            const randomIndex = Math.floor(Math.random() * tarotData.length);
            const selectedCard = tarotData[randomIndex];

            setTimeout(() => {
                document.getElementById('cardTitleEn').innerText = selectedCard.en;
                document.getElementById('cardTitleTh').innerText = selectedCard.th;
                document.getElementById('cardMeaning').innerText = selectedCard.desc;
                document.getElementById('cardModal').style.display = 'flex';
            }, 600);
        }

        function closeModal() {
            document.getElementById('cardModal').style.display = 'none';
            deckContainer.style.transform = `rotate(0deg)`;
            rotationAngle = 0;
            createDeck();
            document.getElementById('status').innerText = "คลิกที่กองไพ่ หรือ แบมือ ✋ หน้ากล้องเพื่อเริ่มสุ่ม";
        }

        // MediaPipe Hand Tracking Setup
        const videoElement = document.getElementById('webcam');

        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

            const landmarks = results.multiHandLandmarks[0];
            const wrist = landmarks[0];
            const fingerTips = [8, 12, 16, 20];
            let isFist = true;
            let isOpenHand = true;

            fingerTips.forEach(tipIdx => {
                const distance = Math.hypot(landmarks[tipIdx].x - wrist.x, landmarks[tipIdx].y - wrist.y);
                if (distance > 0.35) isFist = false;
                if (distance < 0.25) isOpenHand = false;
            });

            if (isOpenHand && !isSpinning) {
                startSpread();
            } else if (isFist && isSpinning) {
                stopAndPickCard();
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
