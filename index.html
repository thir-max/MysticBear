<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Tarot - คุณหมีร่ายเวทมนตร์</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color-1: #0a0612;
      --bg-color-2: #190c2e;
      --bg-color-3: #2d124d;
      --accent-gold: #f3d884;
      --accent-glow: rgba(243, 216, 132, 0.5);
      --font-main: 'Noto Sans Thai', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: var(--font-main);
      background: radial-gradient(ellipse at bottom, var(--bg-color-3) 0%, var(--bg-color-2) 50%, var(--bg-color-1) 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stars-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    .app-container {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* หน้าถามร่ายเวทมนตร์ */
    .setup-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(243, 216, 132, 0.2);
      border-radius: 28px;
      padding: 40px 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .setup-card h1 {
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 28px;
      text-shadow: 0 0 16px var(--accent-glow);
      line-height: 1.6;
    }

    .btn-group { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 250px; }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(243, 216, 132, 0.3);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 30px;
      font-family: var(--font-main);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .btn:hover, .btn:active {
      background: rgba(243, 216, 132, 0.2);
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-primary { background: rgba(243, 216, 132, 0.15); border-color: var(--accent-gold); font-weight: 600; }

    /* น้องหมี */
    .bear-wrapper {
      position: absolute;
      top: 40px;
      width: 100px;
      height: 100px;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .bear-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 12px rgba(243, 216, 132, 0.3)); }
    .wand-arm { transform-origin: 75px 65px; animation: floatWand 3s ease-in-out infinite; }
    .casting .wand-arm { animation: castMagic 0.4s ease-in-out infinite alternate !important; }

    @keyframes floatWand { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
    @keyframes castMagic { 0% { transform: rotate(-5deg); } 100% { transform: rotate(-30deg); } }

    .magic-sparkles { position: absolute; top: 10px; right: 10px; opacity: 0; transition: opacity 0.3s; }
    .casting .magic-sparkles { opacity: 1; }
    .sparkle { position: absolute; font-size: 14px; animation: popSparkle 0.8s ease-out infinite; }
    @keyframes popSparkle { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.4) translate(-10px, -15px); opacity: 0; } }

    #webcam { display: none; }

    /* Badge สถานะด้านบน */
    .hand-status-badge {
      position: absolute;
      top: 15px;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e2d5ff;
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    /* วงรีสุ่มไพ่หมุนเต็มหน้าจอ (Full-Screen Ellipse 3D) */
    .ellipse-container {
      position: absolute;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      display: none;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      z-index: 5;
    }

    .mini-card {
      position: absolute;
      width: 75px;
      height: 120px;
      background: linear-gradient(135deg, #2a1147, #120624);
      border: 1.5px solid var(--accent-gold);
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--accent-gold);
      transition: transform 0.05s linear;
    }

    /* การ์ดผลคำทำนายหลัก */
    .card-display {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
      z-index: 15;
      margin-top: 80px;
    }

    .tarot-card {
      width: 220px;
      height: 340px;
      background: rgba(20, 10, 35, 0.85);
      border: 1.5px solid var(--accent-gold);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(243, 216, 132, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    .card-header { font-size: 0.75rem; letter-spacing: 2px; color: #a393c8; font-weight: 600; }
    .card-title { font-size: 1.25rem; font-weight: 600; color: var(--accent-gold); margin: 6px 0 2px 0; }
    .card-title-en { font-size: 0.8rem; color: #9f8ec2; margin-bottom: 8px; }
    .card-keywords { display: flex; wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 8px; }
    .tag { font-size: 0.7rem; font-weight: 500; background: rgba(243, 216, 132, 0.1); border: 1px solid rgba(243, 216, 132, 0.3); color: var(--accent-gold); padding: 2px 6px; border-radius: 8px; }
    .card-meaning { font-size: 0.85rem; line-height: 1.5; color: #ded5f5; text-align: justify; overflow-y: auto; max-height: 125px; }
  </style>
</head>
<body>

  <canvas id="stars-canvas"></canvas>

  <div class="app-container">
    
    <div id="setup-screen" class="setup-card">
      <h1>ต้องการร่ายเวทมนต์กับคุณหมีหรือไม่</h1>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="initMagicMode()">ต้องการ</button>
        <button class="btn" onclick="initTouchMode()">ไม่เป็นไร</button>
      </div>
    </div>

    <div id="hand-status" class="hand-status-badge">
      <span id="hand-icon">✋</span>
      <span id="hand-text">กำลังค้นหามือ...</span>
    </div>

    <div id="bear-container" class="bear-wrapper">
      <div class="magic-sparkles">
        <span class="sparkle">✨</span><span class="sparkle">⭐</span><span class="sparkle">✨</span>
      </div>
      <svg class="bear-svg" viewBox="0 0 120 120">
        <circle cx="35" cy="35" r="14" fill="#a47854" /><circle cx="35" cy="35" r="8" fill="#f3cbb0" />
        <circle cx="85" cy="35" r="14" fill="#a47854" /><circle cx="85" cy="35" r="8" fill="#f3cbb0" />
        <circle cx="60" cy="55" r="32" fill="#bc8c65" />
        <path d="M 32 40 Q 60 10 88 40 Z" fill="#2d124d" stroke="#f3d884" stroke-width="1.5"/>
        <ellipse cx="60" cy="40" rx="30" ry="6" fill="#190c2e" stroke="#f3d884" stroke-width="1.5"/>
        <circle cx="60" cy="18" r="3" fill="#f3d884" />
        <circle cx="48" cy="52" r="3.5" fill="#2c1a0e" /><circle cx="72" cy="52" r="3.5" fill="#2c1a0e" />
        <circle cx="50" cy="50" r="1" fill="#ffffff" /><circle cx="74" cy="50" r="1" fill="#ffffff" />
        <ellipse cx="60" cy="60" rx="9" ry="6" fill="#f3cbb0" /><ellipse cx="60" cy="58" rx="4" ry="2.5" fill="#2c1a0e" />
        <path d="M 57 62 Q 60 65 63 62" stroke="#2c1a0e" stroke-width="1.5" fill="none" />
        <circle cx="42" cy="58" r="4" fill="#ffb3ba" opacity="0.6" /><circle cx="78" cy="58" r="4" fill="#ffb3ba" opacity="0.6" />
        <path d="M 40 85 Q 60 75 80 85 L 85 110 Q 60 115 35 110 Z" fill="#a47854" />
        <g class="wand-arm">
          <path d="M 72 75 L 95 55" stroke="#795548" stroke-width="3.5" stroke-linecap="round" />
          <polygon points="95,47 98,53 104,55 98,57 95,63 92,57 86,55 92,53" fill="#f3d884" />
          <path d="M 70 78 Q 80 72 85 62" stroke="#bc8c65" stroke-width="7" fill="none" />
        </g>
        <path d="M 50 78 Q 40 85 38 95" stroke="#bc8c65" stroke-width="7" fill="none" />
      </svg>
    </div>

    <div id="ellipse-carousel" class="ellipse-container"></div>

    <div id="card-display" class="card-display">
      <div class="tarot-card" onclick="startEllipseShuffle()">
        <div class="card-header" id="card-arcana">MAJOR ARCANA</div>
        <div>
          <div class="card-title" id="card-name-th">แตะเพื่อวนสุ่มไพ่</div>
          <div class="card-title-en" id="card-name-en">Tap or Gestures to Shuffle</div>
          <div class="card-keywords" id="card-keywords">
            <span class="tag">ชะตาชีวิต</span><span class="tag">คำตอบ</span>
          </div>
        </div>
        <div class="card-meaning" id="card-meaning">
          แตะที่ไพ่ หรือกำมือ (✊) ค้างไว้ครู่หนึ่ง เพื่อให้คุณหมีร่ายเวทหมุนสุ่มไพ่ให้คุณ
        </div>
      </div>

      <button class="btn btn-primary" style="margin-top: 18px; width: 100%; max-width: 220px;" onclick="startEllipseShuffle()">🔮 สุ่มไพ่ใหม่</button>
    </div>

  </div>

  <video id="webcam" playsinline></video>

  <script>
    /* 1. Web Audio API เสียงเวทมนตร์ & เสียงไพ่หมุน */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playMagicSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.12, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.4);
      });
    }

    function playCardCarouselSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      for (let i = 0; i < 12; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180 + Math.random() * 140, now + i * 0.06);
        gain.gain.setValueAtTime(0.06, now + i * 0.06);
        gain.gain.linearRampToValueAtTime(0.005, now + i * 0.06 + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.05);
      }
    }

    /* 2. ฐานข้อมูลไพ่ Tarot */
    const tarotDeck = [
      { id: "m00", arcana: "Major Arcana", nameEn: "The Fool", nameTh: "ผู้เริ่มต้น", keywords: ["จุดเริ่มต้น", "อิสระ"], meaning: "คุณกำลังยืนอยู่ตรงจุดเริ่มต้นของการเดินทางครั้งใหม่ในชีวิต ปล่อยวางความกลัวและเชื่อมั่นในสัญชาตญาณ" },
      { id: "m01", arcana: "Major Arcana", nameEn: "The Magician", nameTh: "นักมายากล", keywords: ["ศักยภาพ", "ไหวพริบ"], meaning: "ทรัพยากรทุกอย่างพร้อมแล้วในมือคุณ จงมั่นใจและเริ่มแปรเปลี่ยนความฝันให้กลายเป็นความจริง" },
      { id: "m02", arcana: "Major Arcana", nameEn: "The High Priestess", nameTh: "นักบวชหญิง", keywords: ["สัญชาตญาณ", "ปัญญา"], meaning: "คำตอบซ่อนอยู่ในจิตใจของคุณ รับฟังเสียงสัญชาตญาณและสังเกตการณ์อย่างเงียบๆ" },
      { id: "m03", arcana: "Major Arcana", nameEn: "The Empress", nameTh: "จักรพรรดินี", keywords: ["ความอุดมสมบูรณ์", "ความรัก"], meaning: "ช่วงเวลาแห่งผลลัพธ์และการดูแลเอาใจใส่ สิ่งที่คุณปลูกไว้นั้นกำลังเติบโตและงอกงาม" },
      { id: "m17", arcana: "Major Arcana", nameEn: "The Star", nameTh: "ดวงดาวแห่งความหวัง", keywords: ["ความหวัง", "แรงบันดาลใจ"], meaning: "พายุร้ายได้ผ่านพ้นไปแล้ว แสงสว่างและความสงบกำลังกลับคืนมา จงศรัทธาในอนาคต" },
      { id: "m19", arcana: "Major Arcana", nameEn: "The Sun", nameTh: "ดวงอาทิตย์", keywords: ["ความสำเร็จ", "พลังชีวิต"], meaning: "ไพ่แห่งความโชคดีและความสดใส ทุกสิ่งที่ทำจะได้รับผลตอบแทนงดงาม เต็มไปด้วยพลังบวก" }
    ];

    /* 3. Background ดวงดาว */
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    class Star {
      constructor() {
        this.x = (Math.random() - 0.5) * canvas.width * 2;
        this.y = (Math.random() - 0.5) * canvas.height * 2;
        this.z = Math.random() * canvas.width;
        this.size = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random();
      }
      update() { this.z -= 0.5; if (this.z <= 0) this.z = canvas.width; }
      draw() {
        const sx = (this.x / this.z) * canvas.width + canvas.width / 2;
        const sy = (this.y / this.z) * canvas.height + canvas.height / 2;
        if (sx >= 0 && sx <= canvas.width && sy >= 0 && sy <= canvas.height) {
          ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.2, (1 - this.z / canvas.width) * this.size * 2), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(243, 216, 132, ${this.alpha})`; ctx.fill();
        }
      }
    }
    function initStars() { resizeCanvas(); stars = Array.from({ length: 120 }, () => new Star()); }
    function animateStars() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animateStars); }
    window.addEventListener('resize', resizeCanvas); initStars(); animateStars();

    /* 4. อนิเมชันไพ่หมุนเป็นวงรีเต็มจอ (Full Screen Ellipse) */
    const carousel = document.getElementById('ellipse-carousel');
    const totalMiniCards = 10;
    let angleOffset = 0;
    let isShuffling = false;
    let isGestureMode = false;

    function createEllipseCards() {
      carousel.innerHTML = '';
      for (let i = 0; i < totalMiniCards; i++) {
        const card = document.createElement('div');
        card.className = 'mini-card';
        card.innerText = '✨';
        carousel.appendChild(card);
      }
    }

    function updateEllipsePosition() {
      const cards = carousel.children;
      // ปรับรัศมีวงรีให้กว้างเต็มหน้าจอ
      const rx = Math.min(window.innerWidth * 0.4, 380);
      const ry = Math.min(window.innerHeight * 0.28, 200);

      for (let i = 0; i < cards.length; i++) {
        const angle = angleOffset + (i * (2 * Math.PI / cards.length));
        const x = Math.cos(angle) * rx;
        const y = Math.sin(angle) * ry;
        const scale = 0.65 + (y + ry) / (2 * ry) * 0.45;
        const zIndex = Math.round((y + ry) * 10);
        cards[i].style.transform = `translate3d(${x}px, ${y}px, 0px) scale(${scale})`;
        cards[i].style.zIndex = zIndex;
      }
    }

    function updateBadgeStatus(icon, text) {
      document.getElementById('hand-icon').innerText = icon;
      document.getElementById('hand-text').innerText = text;
    }

    function startEllipseShuffle() {
      if (isShuffling) return;
      isShuffling = true;

      const bear = document.getElementById('bear-container');
      const cardDisplay = document.getElementById('card-display');

      bear.classList.add('casting');
      cardDisplay.style.display = 'none';
      carousel.style.display = 'flex';

      if (isGestureMode) {
        updateBadgeStatus("✊", "คุณหมีกำลังหมุนสุ่มไพ่เต็มจอ...");
      }

      playCardCarouselSound();

      let startTime = null;
      const duration = 1400; // เพิ่มเวลาหมุนวงรีให้นุ่มนวล ชัดเจน

      function animateCarousel(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = timestamp - startTime;
        angleOffset += 0.22;
        updateEllipsePosition();

        if (progress < duration) {
          requestAnimationFrame(animateCarousel);
        } else {
          carousel.style.display = 'none';
          cardDisplay.style.display = 'flex';
          bear.classList.remove('casting');
          
          const card = tarotDeck[Math.floor(Math.random() * tarotDeck.length)];
          document.getElementById('card-arcana').innerText = card.arcana;
          document.getElementById('card-name-th').innerText = card.nameTh;
          document.getElementById('card-name-en').innerText = card.nameEn;
          document.getElementById('card-meaning').innerText = card.meaning;
          document.getElementById('card-keywords').innerHTML = card.keywords.map(k => `<span class="tag">${k}</span>`).join('');
          
          playMagicSound();
          isShuffling = false;

          if (isGestureMode) {
            updateBadgeStatus("✋", "พร้อมร่ายเวท (กำมือเพื่อหมุนสุ่มไพ่)");
          }
        }
      }
      requestAnimationFrame(animateCarousel);
    }

    /* 5. ระบบตรวจจับมือและจังหวะอ่านสัญลักษณ์ */
    function initTouchMode() {
      isGestureMode = false;
      playMagicSound();
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('bear-container').style.display = 'flex';
      createEllipseCards();
      startEllipseShuffle();
    }

    let fistHoldStartTime = 0;
    let lastShuffleTriggerTime = 0;

    function initMagicMode() {
      isGestureMode = true;
      playMagicSound();
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('bear-container').style.display = 'flex';
      document.getElementById('hand-status').style.display = 'flex';
      
      createEllipseCards();
      updateBadgeStatus("✨", "กำลังเปิดระบบตรวจจับมือ...");

      const videoElement = document.getElementById('webcam');
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.65, minTrackingConfidence: 0.65 });
      hands.onResults(onHandResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
      });

      camera.start()
        .then(() => updateBadgeStatus("✋", "พร้อมร่ายเวท (กำมือเพื่อหมุนสุ่มไพ่)"))
        .catch(() => updateBadgeStatus("👆", "ไม่พบกล้อง เปลี่ยนเป็นระบบแตะสัมผัส"));

      startEllipseShuffle();
    }

    function onHandResults(results) {
      if (isShuffling) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // คำนวณระยะห่างเพื่อแยกแยะแบมือ (✋) และกำมือ (✊)
        const distance = Math.hypot(landmarks[8].x - landmarks[0].x, landmarks[8].y - landmarks[0].y);
        const now = Date.now();

        if (distance < 0.25) { 
          // กำมือ (✊) -> ต้องกำค้างไว้ 400ms เพื่อยืนยันคำสั่ง
          if (fistHoldStartTime === 0) {
            fistHoldStartTime = now;
          } else if (now - fistHoldStartTime > 400 && now - lastShuffleTriggerTime > 2500) {
            updateBadgeStatus("✊", "ตรวจพบการกำมือ! กำลังร่ายเวท...");
            lastShuffleTriggerTime = now;
            fistHoldStartTime = 0;
            startEllipseShuffle();
          }
        } else {
          // แบมือ (✋) -> รีเซ็ตเวลากำมือ
          fistHoldStartTime = 0;
          updateBadgeStatus("✋", "พร้อมร่ายเวท (กำมือเพื่อหมุนสุ่มไพ่)");
        }
      } else {
        // เอามือลง หรือไม่มีมือโชว์ -> อยู่เฉยๆ ไม่ต้องทำอะไร
        fistHoldStartTime = 0;
        updateBadgeStatus("✨", "พร้อมร่ายเวท (ยกมือขึ้นเพื่อควบคุม)");
      }
    }
  </script>
